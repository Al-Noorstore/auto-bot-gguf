name: Build APK
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Decode signing keystore
        run: echo "${{ secrets.AUTOBOT_KEYSTORE_B64 }}" | base64 -d > autobot.p12

      # ---------- v3.5 GGUF ENGINE: llama.cpp v0.5.0 (pinned) ----------
      - name: Fetch llama.cpp v0.5.0
        run: |
          git clone --depth 1 --branch v0.5.0 https://github.com/ggml-org/llama.cpp app/src/main/cpp/llama.cpp
          echo "llama.cpp $(git -C app/src/main/cpp/llama.cpp describe --tags) ready"

      # SmolLM2-135M Q4 (~105MB) — LITE + PRO dono mein bundled (chhote phones support)
      - name: Bundle SmolLM2-135M (main assets — all APKs)
        run: |
          mkdir -p app/src/main/assets/models
          curl -L --fail --retry 3 -o app/src/main/assets/models/smollm2-135m-instruct-q4_k_m.gguf \
            https://huggingface.co/QuantFactory/SmolLM2-135M-Instruct-GGUF/resolve/main/SmolLM2-135M-Instruct.Q4_K_M.gguf
          ls -la app/src/main/assets/models/

      # Optional larger model only in PRO (users with more RAM)
      - name: Bundle Qwen2.5-0.5B model (PRO asset only)
        run: |
          mkdir -p app/src/pro/assets/models
          curl -L --fail --retry 3 -o app/src/pro/assets/models/qwen2.5-0.5b-instruct-q4_k_m.gguf \
            https://huggingface.co/Qwen/Qwen2.5-0.5B-Instruct-GGUF/resolve/main/qwen2.5-0.5b-instruct-q4_k_m.gguf
          ls -la app/src/pro/assets/models/

      # ---------- AutoBot LITE (SmolLM bundled, no Python — low-RAM safe) ----------
      # ---------- v4.12: OFFLINE MIC BUNDLED (all APKs — internet-free voice) ----------
      - name: Bundle Vosk voice model (offline mic)
        run: |
          curl -L --fail --retry 3 -o app/src/main/assets/vosk-bundled.zip \
            https://alphacephei.com/vosk/models/vosk-model-small-hi-0.22.zip
          ls -la app/src/main/assets/

      - name: Build AutoBot LITE APK
        run: |
          gradle assembleRelease -PliteBuild=true --no-daemon
          VER=$(grep versionName app/build.gradle | sed 's/.*isLite ? "\([0-9.]*\).*/\1/')
          cp app/build/outputs/apk/release/app-release.apk "AutoBot-GGUF-Lite-v${VER}.apk"

      # ---------- AutoBot PRO (SmolLM + Qwen + Python) ----------
      - name: Build AutoBot PRO APK
        run: |
          gradle clean assembleRelease --no-daemon
          VER=$(grep versionName app/build.gradle | sed 's/.*isLite ? "\([0-9.]*\).*/\1/')
          cp app/build/outputs/apk/release/app-release.apk "AutoBot-GGUF-Pro-v${VER}.apk"

      - name: Upload LITE APK
        uses: actions/upload-artifact@v4
        with:
          name: AutoBot-LITE-APK
          path: AutoBot-GGUF-Lite-*.apk

      - name: Upload PRO APK
        uses: actions/upload-artifact@v4
        with:
          name: AutoBot-PRO-APK
          path: AutoBot-GGUF-Pro-*.apk
